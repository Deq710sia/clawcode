name: Build Windows Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Build renderer + main
        run: npm run build

      - name: Build NSIS installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Generate latest.yml for auto-updater
        shell: pwsh
        run: |
          $exe = Get-ChildItem release\ClawCode-*-x64.exe | Select-Object -First 1
          $portable = Get-ChildItem release\ClawCode-*-portable.exe | Select-Object -First 1
          $version = "${{ github.ref_name }}".TrimStart('v')
          if (-not $version) { $version = "0.0.0" }
          $sha512 = (Get-FileHash $portable.FullName -Algorithm SHA512).Hash.ToLower()
          $size = (Get-Item $portable.FullName).Length
          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
          @"
          version: $version
          files:
            - url: $($portable.Name)
              sha512: $sha512
              size: $size
            - url: $($exe.Name)
              sha512: $((Get-FileHash $exe.FullName -Algorithm SHA512).Hash.ToLower())
              size: $((Get-Item $exe.FullName).Length)
          path: $($portable.Name)
          sha512: $sha512
          releaseDate: "$date"
          "@ | Out-File -Encoding utf8 release\latest.yml

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/ClawCode-*-x64.exe
            release/ClawCode-*-portable.exe
            release/latest.yml
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Upload artifacts (for manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: clawcode-windows-build
          path: |
            release/ClawCode-*-x64.exe
            release/ClawCode-*-portable.exe
            release/latest.yml
